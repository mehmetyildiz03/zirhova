name: ZIRHOVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/game.js
          node --check src/levels.js
          node --check src/weaponSystem.js
          node --check src/brickSystem.js
          node --check src/levelSchema.js
          node --check src/editor.js
          node --check src/controllerSystem.js
          node --check src/navigationSystem.js
      - name: Validate web manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Validate level data
        run: node scripts/validate-levels.mjs
      - name: Validate combat mechanics
        run: node scripts/validate-combat.mjs
      - name: Validate micro-brick physics
        run: node scripts/validate-bricks.mjs
      - name: Validate controller mappings
        run: node scripts/validate-controls.mjs
      - name: Validate navigation sub-grid
        run: node scripts/validate-navigation.mjs
      - name: Verify required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f src/weaponSystem.js
          test -f src/brickSystem.js
          test -f src/levelSchema.js
          test -f src/editor.js
          test -f src/controllerSystem.js
          test -f src/navigationSystem.js
          test -f editor.html
          test -f editor.css
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png

      - name: Responsive phone/tablet smoke test
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 4173 >/tmp/zirhova-http.log 2>&1 &
          sleep 2
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          node scripts/responsive-smoke.mjs
          node scripts/gameplay-smoke.mjs
          node scripts/navigation-smoke.mjs
          node scripts/movement-audit-smoke.mjs
          node scripts/mobile-touch-smoke.mjs
          node scripts/editor-smoke.mjs
          node scripts/coop-smoke.mjs
